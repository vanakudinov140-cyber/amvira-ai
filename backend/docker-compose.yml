services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retention}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retention}
      POSTGRES_DB: ${POSTGRES_DB:-retention}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-retention} -d ${POSTGRES_DB:-retention}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-retention}:${POSTGRES_PASSWORD:-retention}@db:5432/${POSTGRES_DB:-retention}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
