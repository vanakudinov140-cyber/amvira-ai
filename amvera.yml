# Retention CRM API — Amvera Docker deploy (корневой Dockerfile)
# https://docs.amvera.ru/applications/configuration/docker.html
# Не задавайте run.command в UI — используется ENTRYPOINT из Dockerfile

meta:
  environment: docker
  toolchain:
    name: docker

build:
  dockerfile: Dockerfile

run:
  containerPort: 8000
  servicePort: 80
