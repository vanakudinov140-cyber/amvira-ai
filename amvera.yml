# Retention CRM — production на Amvera (Docker, HTTP port 8000)
# https://docs.amvera.ru/applications/configuration/docker.html
# Важно: не задавайте run.command в UI — используется ENTRYPOINT из Dockerfile

meta:
  environment: docker
  toolchain:
    name: docker

build:
  dockerfile: Dockerfile

run:
  containerPort: 8000
  servicePort: 8000
