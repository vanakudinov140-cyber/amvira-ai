# Retention CRM — production на Amvera (Docker, HTTP port 80)
# https://docs.amvera.ru/applications/configuration/docker.html
# Важно: не задавайте run.command в UI — используется ENTRYPOINT из Dockerfile

meta:
  environment: docker
  toolchain:
    name: docker

build:
  dockerfile: Dockerfile

run:
  containerPort: 80
  servicePort: 80
